<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Student Hivemind</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css" integrity="sha256-46r060N2LrChLLb5zowXQ72/iKKNiw/lAmygmHExk/o=" crossorigin="anonymous" />

    <body class="bg-light">

    <!-- Flexbox container to center the login card vertically and horizontally -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow-lg" style="max-width: 400px; width: 100%; border-radius: 12px;">
            
            <!-- Logo / Brand Header -->
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">Student Hivemind</h2>
                <p class="text-muted small">Please select</p>
            </div>

            <!-- Login Form -->
            <form action="#" method="POST" class="needs-validation" novalidate>
                
            <div class = "mb-3">
                <label class="form-label d-block fw-bold">Select an Option</label>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="optradio" value="Student" id="student-login">Student
                    <label class="form-check-label" for="student-login"></label> <input type="text" id="student-login-username" placeholder="Please enter student code">
                </div>
                <br>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="optradio" value="Lecturer" id="lecturer-login">Lecturer
                    <label class="form-check-label" for="lecturer-login"></label> <input type="password" id="lecturer-login-password" placeholder="Please enter staff password">
                </div>
            </div>
 
                <!-- Submit Button -->
                <button type="button" class="btn btn-primary w-100 py-2 fw-semibold" id="submit-login">Sign In</button>
            </form>

        </div>
    </div>
<script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/entry_page.js"></script>
</body>

</html>
