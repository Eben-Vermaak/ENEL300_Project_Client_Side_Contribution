<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Student Hivemind - Lecturer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="main.css">
    <style type="text/css">
    
    
</style>
</head>
<body>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css" integrity="sha256-46r060N2LrChLLb5zowXQ72/iKKNiw/lAmygmHExk/o=" crossorigin="anonymous" />
<div class="container">
<div class="main-body p-0">
    <div class="inner-wrapper">
        <!-- Inner sidebar -->
        <div class="inner-sidebar">
            <!-- Inner sidebar header -->
            <div class="inner-sidebar-header justify-content-center">
                <button class="btn btn-primary has-icon btn-block" type="button" data-toggle="modal" data-target="#threadModal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-plus mr-2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    OPTIONS
                </button>
            </div>
            <!-- /Inner sidebar header -->

            <!-- Inner sidebar body -->
            <div class="inner-sidebar-body p-0">
                <div class="p-3 h-100" data-simplebar="init">
                    <div class="simplebar-wrapper" style="margin: -16px;">
                        <div class="simplebar-height-auto-observer-wrapper"><div class="simplebar-height-auto-observer"></div></div>
                        <div class="simplebar-mask">
                            <div class="simplebar-offset" style="right: 0px; bottom: 0px;">
                            </div>
                        </div>
                        <div class="simplebar-placeholder" style="width: 234px; height: 292px;"></div>
                    </div>
                    <div class="simplebar-track simplebar-horizontal" style="visibility: hidden;"><div class="simplebar-scrollbar" style="width: 0px; display: none;"></div></div>
                    <div class="simplebar-track simplebar-vertical" style="visibility: visible;"><div class="simplebar-scrollbar" style="height: 151px; display: block; transform: translate3d(0px, 0px, 0px);"></div></div>
                </div>
            </div>
            <!-- /Inner sidebar body -->
        </div>
        <!-- /Inner sidebar -->

        <!-- Inner main -->
        <div class="inner-main">
            <!-- Inner main header -->
            <div class="inner-main-header">
                <a class="nav-link nav-icon rounded-circle nav-link-faded mr-3 d-md-none" href="#" data-toggle="inner-sidebar"><i class="material-icons">arrow_forward_ios</i></a>
                <select class="custom-select custom-select-sm w-auto mr-1" id="order-select">
                    <option value="0">Popular</option>
                    <option value="1">Latest</option>
                </select>
                <span class="input-icon input-icon-sm ml-auto w-auto">
                </span>
            </div>
            <!-- /Inner main header -->

            <!-- Inner main body -->

            <!-- Forum List -->
             
            <div class="inner-main-body p-2 p-sm-3 collapse forum-content show">
            <div class="card feedback-card" id="feedback-container">
                <div class="card-body">
                    <div class="feedback-title">Feedback on lecture</div>
                    <div class="feedback-options" role="group" aria-label="Rate your experience" id="feedback-container-image">
                        <!-- <img class="card feedback-card show" id="feedback-image"  style="min-width: 80vh; max-height: 40vh; display: flex;"/> -->
                        <img class="card feedback-card show" id="feedback-image" style="height: 40vh; display: block; margin: auto;"/>

                    </div>
                </div>
            </div>
                <div id="forum-posts-container"></div>
            </div>
            <!-- /Forum List -->

            <!-- /Inner main body -->
        </div>

        <!-- /Inner main -->
    </div>

    <!-- New Thread Modal -->
    <div class="modal fade" id="threadModal" tabindex="-1" role="dialog" aria-labelledby="threadModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <form onkeydown="if(event.keyCode === 13) {return false;}"> <!--Prevent enter key from doing anything-->
                    <div class="modal-header d-flex align-items-center bg-primary text-white">
                        <h6 class="modal-title mb-0" id="threadModalLabel">Options</h6>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <div class="form-check-inline">
                                <label for="name-option" class="option-name">Hide Names: </label>
                                <input type="checkbox" class="form-control form-check option-check" id="name-option" autofocus=""/>
                            </div>
                            <br>
                            <div class="form-check-inline">
                                <label for="feedback-option" class="option-name">Hide Feedback Chart: </label>
                                <input type="checkbox" class="form-control form-check option-check" id="feedback-option" autofocus=""/>
                            </div>
                            <br>
                            <div class="form-check-inline" >
                                <label for="expire-option" class="option-name">Let Questions Expire: </label>
                                <input type="checkbox" class="form-control option-check" id="expire-option" autofocus="" onchange="slider_check();"/>
                            </div>
                            <div id="expire-option-expanded" style="display: none;">
                                <input type="range" min="1" max="50" value="10" class="form-control" id="expire-slider" style="position: relative;"/>
                                <i class="far" id="slider-value-display"></i>
                            </div>     
                            <br>
                            <div class="form-check-inline">
                                <button type="button" class="btn btn-primary" id="delete-all-posts">Delete All Posts</button>
                            </div>                      
                        </div>
                        <textarea class="form-control summernote" style="display: none;"></textarea>

                        <div class="custom-file form-control-sm mt-3" style="max-width: 300px;">

                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-dismiss="modal" id="cancel-options">Cancel</button>
                        <button type="button" class="btn btn-primary" id="save-options">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/lecturer_forum.js"></script>
</body>
</html>
